<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AX Star 2026 출품작 소개</title>
<style>
:root{
  --red:#A50034;--red-deep:#7A0026;--red-soft:#FBEFF3;
  --gold:#B8860B;--gold-bg:#FFF8E6;
  --ink:#18181B;--sub:#61616A;--mute:#9A9AA3;
  --line:#E8E6E3;--bg:#F7F6F4;--paper:#fff;
  --side:260px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",-apple-system,"Segoe UI",sans-serif;
  line-height:1.55;font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}

/* ===== Sidebar ===== */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:#fff;border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:30;transition:transform .25s}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--line)}
.brand .eb{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--red)}
.brand .logo{display:block;height:28px;width:auto;margin-bottom:8px}
.brand h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.02em}
.search{margin:14px 16px 6px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;
  padding:9px 12px 9px 32px;font-size:13px;font-family:inherit;outline:none}
.search input:focus{border-color:var(--red);background:#fff}
.search span{position:absolute;left:11px;top:8px;font-size:13px;color:var(--mute)}
.nav{flex:1;overflow-y:auto;padding:6px 10px 16px}
.nav .grp{font-size:11px;font-weight:700;color:var(--mute);letter-spacing:.06em;margin:16px 10px 6px}
.nav button.item{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;
  padding:9px 10px;border-radius:9px;font-size:13.5px;color:#333;text-align:left}
.nav button.item:hover{background:var(--bg)}
.nav button.item.on{background:var(--red-soft);color:var(--red);font-weight:700}
.nav .ic{width:20px;text-align:center}
.nav .cnt{margin-left:auto;font-size:11.5px;color:var(--mute);font-weight:600;background:var(--bg);
  border-radius:999px;padding:1px 8px}
.nav button.item.on .cnt{background:#fff;color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 10px}
.fchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;color:#444}
.fchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.side-foot{padding:12px 20px;border-top:1px solid var(--line);font-size:11px;color:var(--mute)}

/* ===== Main ===== */
main{margin-left:var(--side);min-height:100%;padding:32px 40px 60px}
.topbar{display:none}
.ph{margin-bottom:22px}
.ph .crumb{font-size:12px;color:var(--mute);font-weight:600}
.ph h2{font-size:24px;margin:4px 0 4px;letter-spacing:-.02em}
.ph p{margin:0;color:var(--sub);font-size:13.5px}
.active-filter{display:inline-flex;gap:6px;align-items:center;margin-top:10px;font-size:12px;color:var(--sub)}
.active-filter button{border:0;background:none;color:var(--red);font-size:12px;font-weight:700;padding:0}

/* Hero */
.hero{background:linear-gradient(135deg,var(--red),var(--red-deep));color:#fff;border-radius:18px;
  padding:30px 32px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;
  background:rgba(255,255,255,.08)}
.hero .eb{font-size:12px;letter-spacing:.12em;font-weight:700;opacity:.85}
.hero h2{font-size:28px;margin:6px 0 8px;letter-spacing:-.02em}
.hero p{margin:0;opacity:.9;max-width:620px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi b{display:block;font-size:26px;letter-spacing:-.02em}
.kpi span{font-size:12.5px;color:var(--sub)}
.kpi.g b{color:var(--gold)}

.sec{margin-top:30px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.sec-h h3{font-size:16px;margin:0}
.sec-h a{font-size:12.5px;color:var(--red);font-weight:700;cursor:pointer}

/* Category overview */
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.catcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;
  transition:.15s;text-align:left}
.catcard:hover{border-color:var(--red);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.06)}
.catcard .top{display:flex;justify-content:space-between;align-items:center}
.catcard .ic{font-size:22px}
.catcard .n{font-size:22px;font-weight:800;color:var(--red)}
.catcard h4{margin:10px 0 4px;font-size:14.5px}
.catcard p{margin:0;font-size:12.5px;color:var(--sub)}
.bar{height:5px;background:var(--bg);border-radius:9px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:9px}

.aibar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.airow{display:grid;grid-template-columns:130px 1fr 34px;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.airow .t{height:10px;background:var(--bg);border-radius:9px;overflow:hidden}
.airow .t i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#D4456F);border-radius:9px}
.airow b{text-align:right;font-size:12.5px}
.note{font-size:11.5px;color:var(--mute);margin-top:8px}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;cursor:pointer;
  display:flex;flex-direction:column;transition:.15s;text-align:left}
.card:hover{border-color:var(--red);box-shadow:0 6px 18px rgba(0,0,0,.06);transform:translateY(-2px)}
.card.aw{border:1.5px solid var(--gold);background:linear-gradient(180deg,var(--gold-bg),#fff 90px)}
.card .tag{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--bg);color:var(--sub)}
.pill.best{background:var(--gold);color:#fff}
.pill.ex{background:#fff;color:var(--gold);border:1.2px solid var(--gold)}
.card h4{margin:0 0 3px;font-size:15px;line-height:1.4;letter-spacing:-.01em}
.card .who{font-size:12px;color:var(--mute)}
.card .sum{font-size:13px;color:#3a3a40;margin:10px 0 12px}
.card ul{list-style:none;margin:auto 0 0;padding:10px 0 0;border-top:1px dashed var(--line)}
.card li{font-size:12.5px;font-weight:700;color:var(--red-deep);padding:2px 0 2px 18px;position:relative}
.card li:before{content:"✔";position:absolute;left:0;color:var(--red)}
.card .ai{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.card .ai span{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:40px;text-align:center;color:var(--sub)}
.cat-block{margin-top:26px}
.cat-block:first-child{margin-top:0}
.cat-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin:0 0 12px}
.cat-title small{font-weight:600;color:var(--mute);font-size:12px}

/* ===== Drawer ===== */
.dim{position:fixed;inset:0;background:rgba(20,20,24,.35);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.dim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(820px,100%);background:#fff;z-index:50;
  transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;
  box-shadow:-10px 0 40px rgba(0,0,0,.12)}
.drawer.on{transform:none}
.dh{padding:22px 26px 18px;border-bottom:1px solid var(--line);position:relative}
.dh.aw{background:linear-gradient(180deg,var(--gold-bg),#fff)}
.dh h3{margin:8px 0 4px;font-size:19px;line-height:1.4;padding-right:30px;letter-spacing:-.01em}
.dh .who{font-size:13px;color:var(--sub)}
.x{position:absolute;right:18px;top:18px;border:0;background:var(--bg);width:32px;height:32px;border-radius:50%;font-size:16px}
.db{overflow-y:auto;padding:14px 26px 30px;flex:1}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:6px 0 14px}
.hl div{background:var(--red-soft);border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:700;color:var(--red-deep)}
details{border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden}
summary{list-style:none;padding:12px 16px;font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary:after{content:"›";margin-left:auto;font-size:18px;color:var(--mute);transition:.2s}
details[open] summary:after{transform:rotate(90deg)}
details[open] summary{border-bottom:1px solid var(--line);background:#FCFBFA}
.dc{padding:14px 18px 16px;font-size:13.5px;color:#333;line-height:1.75;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.dc a{color:var(--red);text-decoration:underline;word-break:break-all}
.dc code{background:#F1EFEC;border-radius:4px;padding:0 4px;font-size:12.5px;font-family:Consolas,monospace}
.dc .tchips{white-space:normal;margin-bottom:10px}
.dc .raw{border-top:1px dashed var(--line);padding-top:10px;color:#444}
.dmeta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute);margin-top:6px}
.dtools{display:flex;justify-content:flex-end;margin:4px 0 2px}
.dtools button{border:0;background:none;color:var(--sub);font-size:12px;font-weight:700;padding:4px 2px}
.dtools button:hover{color:var(--red)}
.dc.q{background:#FDF3F5;color:#6B0022}
.dc.l{background:#F1F5F2;color:#2E4B3E}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tchips span{background:var(--bg);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:#444}
.dnav{display:flex;justify-content:space-between;gap:10px;padding:14px 26px;border-top:1px solid var(--line)}
.dnav button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;font-size:13px;font-weight:600}
.dnav button:hover{border-color:var(--red);color:var(--red)}
.dnav button:disabled{opacity:.35;pointer-events:none}

/* ===== Responsive ===== */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){
  .side{transform:translateX(-100%);box-shadow:10px 0 40px rgba(0,0,0,.12)}
  .side.on{transform:none}
  main{margin-left:0;padding:0 18px 50px}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);padding:14px 0;z-index:20}
  .topbar button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;font-size:15px}
  .topbar b{font-size:15px}
  .hero{padding:24px 22px}.hero h2{font-size:22px}
}
@media print{.side,.topbar,.dim,.drawer{display:none}main{margin:0}}
</style>
</head>

  <div class="search"><span>🔍</span><input id="q" type="search" placeholder="과제명·출품자·기술 검색"></div>

</aside>

"how": "① 진입 구조 — 버튼 세 개, 입력은 폴더 하나\n컨텐츠 관리 시스템 칸반보드의 카드 상세 모달 상단에 편집 자동화·더빙&번역 자동화·자막 디자인 세 버튼을 두었습니다. 카드에 등록된 NAS 경로가 기본값으로 채워지고, 실행하면 진행 단계·로그가 SSE로 실시간 표시되며 중간 중단이 가능합니다. 세 기능 모두 원본을 수정하지 않고 결과를 새 폴더에 쌓으며(_2차·_01·_수정01 자동 번호), GPU 락으로 한 번에 한 작업만 실행합니다.\n\n② 편집 자동화 — 19단계 무인 파이프라인\n영상 정보 확인 → 멀티캠 싱크(타임코드/파형) → 노이즈 제거·음량 평탄화 → 무음 구간 분석 → Whisper STT → 성문 화자 구분 → 편집점·음량 분석 → 간투사·실수·제작대화 판정 → 재촬영 판정 → 챕터·요약·제목·태그 → 하이라이트 발췌 → 자막 교열 → 슬라이드 화면 인식 → 썸네일 → 프리미어 XML → 검수 프록시까지 한 번의 실행으로 이어집니다. 산출물은 정리음성·자막(SRT 3종)·시퀀스(XML 3종)·리포트·썸네일·검수프록시 6개 폴더로 나옵니다.\n현장에서 깨지던 지점은 각각 다르게 풀었습니다. 카메라마다 마이크가 달라 원시 파형 상관이 실패하므로 에너지 포락선을 맞춰 싱크하고, 기준 카메라가 멈춘 사이에도 다른 캠은 돌았으므로 클립 하나에 구간별 오프셋을 따로 부여하며, 강의 소재는 길이의 60% 이상이 무음이라 발화 구간만 STT에 넘겨 반복 환각을 차단하고, 성문 임베딩으로 강사와 촬영자를 분리해 촬영자의 지시·잡담이 자막과 컷 판정에 섞이지 않게 했습니다.\n\n③ 더빙 & 번역 자동화 — 시간 제약 번역과 고정 배치\n11개 언어(한·영·중·일·스페인·프랑스·포르투갈·힌디·러시아·아랍·독일)를 지원합니다. 프롬프트를 단순 번역이 아니라 \"해당 자막 큐에 주어진 발화 시간 안에 읽을 수 있는 길이\"라는 제약 조건으로 설계했고, 용어집(공통·언어별, 최대 5,000행)으로 제품명·기술용어 표기를 강제 고정했습니다. 합성 전 전처리로 러시아어·아랍어는 영문 표기를 자국 문자로 음차 변환하고(LG → элджи), 클로닝 엔진에 발음기가 없는 점을 감안해 약어를 읽는 소리대로 풀어 넘기며(USB → you ess bee), 클로닝 참조 음성은 잡음 제거 후 학습시킵니다.\n배치 설계의 핵심은 각 큐를 SRT 시작 시각에 고정해 앞 큐가 길어져도 뒤가 밀리지 않게 한 것입니다. 길이 초과 시 ① TTS 속도 재합성(무손실, 최대 1.4배) → ② atempo 미세 보정(최대 1.05배) → ③ A2 트랙 분리 + 경고 마커 순으로 처리해, 편집자는 마커가 찍힌 곳만 확인하면 됩니다.\n\n④ 자막 디자인 — AI에게 그림을 그리게 하지 않는 설계\n룩 5종(제품 분해·조립 / 이론·필기 / 예능 / 브이로그 / 쇼츠), 서체(오픈·사내 LG EI Text·LG스마트체2.0·혼합), 출력 구성(진행바·하단 자막·강조 연출), 범위(미리보기 30초·전체)만 고르면 됩니다. 최종본을 재-STT해 단어 단위로 정렬하므로 편집 컷이 들어가도 글자가 밀리지 않습니다.\n프롬프트 구조의 핵심은 LLM에 좌표를 맡기지 않는 것입니다. LLM은 \"어떤 구간을 어떤 종류로 강조할지\"만 JSON으로 출력하고, 좌표·크기·애니메이션은 스타일 팩 규칙으로 렌더러가 결정론적으로 계산합니다. 따라서 같은 입력이면 같은 결과가 나오고, AI 연출이 배치 규칙(하단 자막 대역 침범 금지 등)을 어기면 그 항목만 버리며, 모델이 실패해도 규칙 엔진 결과만으로 끝까지 진행합니다. 산출물에는 배움마당 등록용 챕터 엑셀과, .ass를 읽지 못하는 프리미어를 위한 투명 PNG + xmeml 세트가 함께 나옵니다.\n\n⑤ 공통 설계 원칙 세 가지\n원본은 그대로 둔다(결과는 항상 새 폴더에 누적). 사내에서 끝난다(STT·화자분석·LLM·TTS 전부 로컬, TTS 엔진은 HF_HUB_OFFLINE=1·TRANSFORMERS_OFFLINE=1로 외부 접속 자체를 차단). 지우지 않고 표시한다(삭제후보는 Rose 라벨, 초과 큐는 경고 마커로 남기고 최종 결정은 편집자 몫).\n\n⑥ 자원 운용\n16GB 단일 GPU에서 정밀(12.8GB)·균형(7.6GB)·빠름(9.2GB) 3티어 모델을 작업 성격에 따라 자동 선택하고, 작업 종료 시 상주 모델을 즉시 언로드합니다. 진행 출력이 끊기면 멈춘 프로세스로 보고 자동 종료하며, 내부 예외를 삼키는 STT CLI 특성을 감안해 종료 코드가 아니라 결과 파일 생성 여부로 성공을 판정합니다.",
"quant": "편집 자동화. 하루 촬영 분량(멀티캠 2앵글·다중 클립) 22~35분, 짧은 멀티캠 세트 25분, 이론 단일 카메라 1편 0.71.6분. 완료 기록 50건. 처리 중 담당자가 붙어 있어야 하는 시간은 0분입니다.\n더빙 & 번역 자동화. 영어 번역 + 더빙 한 편 0.4~8.3분, 한국어 SRT 더빙 0.38.4분, 목소리 클로닝 더빙 0.46.8분(모델 로드 포함). 완료 기록 76건.\n자막 디자인. 미리보기 30초·짧은 소재 1.1~3.2분, 진행바·강조 연출 각각 +20~40초. 완료 기록 29건.\n다국어 확장 비용. 언어 11종을 실행 버튼 한 번으로 커버하며, 성우 섭외비·외부 번역 의뢰비·외부 TTS 계정 비용이 발생하지 않습니다.\n건당 외부 API 비용 0원. STT·LLM·TTS 전부 사내 로컬 모델이라 호출량 과금도 계정 한도도 없습니다. 편수가 늘어도 청구서가 늘지 않습니다.\n한 번 실행에 나오는 산출물 6개 폴더(자막 3종·시퀀스 3종 포함) — 종전에는 각각 별도 작업이었습니다.\n인프라. RTX 5070 Ti 16GB 1대로 3개 자동화 전부를 운영합니다.\n참고. 위 수치는 자동화 소요 시간의 실측값입니다. 동일 작업의 기존 수동 소요 시간은 기록이 남아 있지 않아 절감률을 계산하지 않았습니다. 측정 없이 추정치를 적으면 그 숫자가 근거처럼 인용되므로 비워 두었으며, 담당자별 실제 소요를 몇 건만 측정하면 절감 시간을 확정해 채울 수 있습니다.",
"qual": "담당자의 역할이 바뀌었습니다. 나열·받아쓰기·표기 맞추기 같은 반복 노동이 사라지고, 편집자에게는 다듬고 최종 판단하는 일만 남았습니다. 실행 중에는 자리를 비울 수 있어 대기 시간이 다른 업무로 전환됩니다.\n품질이 사람에 따라 흔들리지 않습니다. 치환 목록과 용어집이 기계적으로 적용돼 회차·언어가 달라도 제품명·기술용어 표기가 동일하게 유지되고, 자막 좌표·애니메이션은 규칙으로 계산돼 같은 입력이면 같은 결과가 나옵니다. 목소리 프로파일 저장으로 회차가 바뀌어도 같은 화자 음색을 유지합니다.\n보안 부담이 구조적으로 해소됐습니다. 미공개 제품 대본·음성·영상이 외부로 나가지 않으며, TTS 엔진은 오프라인 플래그로 외부 접속 자체가 봉쇄돼 있습니다. 유일한 외부 경로도 기본 꺼짐이며 사용자가 직접 켜야만 동작합니다.\n되돌릴 수 있는 자동화입니다. 원본은 수정하지 않고 결과만 번호를 붙여 누적하므로, 룩을 바꿔 다시 뽑아도 이전 결과가 남습니다. AI는 지우지 않고 표시만 하므로 자동화 오판이 곧바로 손실로 이어지지 않습니다.\n부분 실패가 전체 실패가 되지 않습니다. AI 연출이 실패해도 규칙 엔진 결과로 끝까지 진행하고, 일괄 재출력 중 한 건이 실패해도 나머지는 계속됩니다. 실험 기능은 파일 단위로 떼어낼 수 있어 운영 파이프라인을 위협하지 않습니다.\n후속 업무까지 이어집니다. 뽑은 챕터가 배움마당 등록용 엑셀로 함께 저장돼 옮겨 적는 작업이 없어졌고, 프리미어 UXP 플러그인으로 편집 도구 안에서 같은 기능을 부를 수 있습니다.\n확장 가능한 자산이 됐습니다. 언어 추가·룩 추가가 설정 수준의 작업이 되어, 해외 서비스 인력 대상 교육 컨텐츠를 필요할 때 즉시 다국어로 낼 수 있는 체계를 확보했습니다.",

"how": "CSV 파일 원본넣기\n\n아래와 같이 요청사항을 엑셀로 정리하여 만들어달라.\n\n1.첨부 엑셀을 Ship to>Part no>Cate_cd 순으로 오름 차순 정렬한다.\n2.Cate_cd의 값='1'의 행을 grey(RGB:217,217,217)색으로 hightlight한다.\n3.refprice/host_currency_id/usd_price 열을 삭제한다.\n4. 각 행의 final_recommend값은 수식 'final_recommend'값=ROUND(MIN(MAX('Calculation_recom'값-'Total Pending_at_ LGE'값,0),'origin_avail'값),0)으로 동일행의 값을 수식으로 적용하여 계산값을 넣고, 노랑색 바탕색((RGB:255,255,0)으로 강조한다.\n\"5.1번 subsidiary를 기준으로 각각 다른 sheet에 분류하여 저장한다.\n단, LGEAINAF/LGEAINAI,NGEAINDJ는 같은 sheet에 포함시킨다. \n      LGEFSEDZ의 경우 Ship_to_nm이 'FORCE PLUS ' 항목들은 모두 삭제한다.\n완성된 신규Sheet명은 총 10개이며, Subsidiary의 앞의 5글자 기준으로 법인명을 사용하며 LGEAI /LGEBN /LGEDG /LGEES /LGEFS /LGEIS/LGEMK/ LGEPL/LGESW/ LGEUK 로 한다. \"\n 카테고리 제목이 있는  1행 위쪽으로 4개행을 삽입하고, 해당 영역은 아래의 내용을 그대로  복사+붙여넣기한 헤더블록으로  sheet를 완성시켜줘\n  \"4행: 구분선(-) + Final_recommend 그룹 아래 0 \"의 값은 수식 =SUBTOTAL(9,각 열의6행:각 열의 ~마지막행)을 적용시켜줘\n  ['헤더블록' 복붙 넣기]\n6. 최종자료는 sheet별로 각각 독립적인 형태로 저장해서 만들어줘.  파일 제목은 ASC_PSI_'sheet명'으로 하여 엑셀파일로 다운받을 수 있도록 생성해줘\n\n7. 메일초안 만들기\n생성된 엑셀파일을 첨부하여, 각각의 법인담당자들에게 전달할 수 있도록 각각의 메일초안을 작성해. (Outlook 작성 창으로 바로 송부할 수 있도록 만들기.)\n메일 발송 대상 및 내용은 아래와 같음\n - 메일제목 : (PSI Sharing) Weekly PSI_\"법인명\"\n - 메일내용 : -내용삭제함-\n - 법인별 메일수신자 및 참조자 : -내용삭제함-",
"quant": "①원본데이터 23만행x73개 컬럼 수작업 시간 절감 : 90분절감, 75%↓(기존 :2시간 → AX활용:30분)\n②정확도 향상\n - 모든 행에 동일한 추천수량 산식을 적용\n - 추천수량의 최솟값을 0으로 제한\n - 추천수량이 origin_avail을 초과하지 않도록 통제\n - Cate_cd=1 행을 동일 색상으로 표시하여 데이터 식별성 확보",
"qual": "23만 건 이상의 글로벌 서비스부품 PSI 데이터를 대상으로, 데이터 정제부터 추천수량 산출, 법인별 문서 생성 및 Outlook 배포 준비까지 하나의 자동화 흐름으로 연결하였다. \n담당자의 반복적인 Excel 작업을 표준화된 디지털 프로세스로 전환하고, 계산 정확성·업무 속도·글로벌 협업 품질을 동시에 개선했다.",
"date": "2026-08-21"
}
];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
ITEMS.forEach((it,i)=>it.id=i);
const AWARD_ORDER={best:0,excellent:1};
const catOf=id=>CATS.find(c=>c.id===id);
const state={view:"home",q:"",ai:new Set(),list:[],cur:-1};

function matches(it){
  if(state.ai.size && !it.ai.some(a=>state.ai.has(a))) return false;
  if(state.q){
    const hay=[it.title,it.fullTitle,it.who,it.team,it.dept,it.summary,it.goal,it.prob,it.tools,it.how,it.quant,it.qual,it.chips.join(" "),it.ai.join(" "),catOf(it.cat).name].join(" ").toLowerCase();
    return state.q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w));
  }
  return true;
}
const filtering=()=>state.q||state.ai.size;

function renderNav(){
  const n=f=>ITEMS.filter(it=>f(it)&&matches(it)).length;
  const btn=(v,ic,label,c)=>`<button class="item ${state.view===v?"on":""}" onclick="go('${v}')"><span class="ic">${ic}</span>${label}${c!==undefined?`<span class="cnt">${c}</span>`:""}</button>`;
  let h=`<div class="grp">개요</div>`+btn("home","🏠","홈 · 한눈에 보기")+btn("award","🏆","수상작",n(i=>i.award))+btn("all","📋","전체 출품작",n(()=>true));
  h+=`<div class="grp">분야별</div>`+CATS.map(c=>btn("cat-"+c.id,c.icon,c.name,n(i=>i.cat===c.id))).join("");
  h+=`<div class="grp">활용 AI 필터</div><div class="chips">`+AIS.map(a=>`<button class="fchip ${state.ai.has(a)?"on":""}" onclick="toggleAI('${a}')">${a}</button>`).join("")+`</div>`;
  document.getElementById("nav").innerHTML=h;
}

function card(it){
  const aw=it.award?`<span class="pill ${it.award==="best"?"best":"ex"}">${it.award==="best"?"★ 최우수상":"우수상"}</span>`:"";
  return `<button class="card ${it.award?"aw":""}" onclick="openItem(${it.id})">
    <div class="tag">${aw}<span class="pill">${catOf(it.cat).icon} ${esc(catOf(it.cat).name)}</span></div>
    <h4>${esc(it.title)}</h4><div class="who">${esc(it.who)} · ${esc(it.team)}</div>
    <div class="sum">${esc(it.summary)}</div>
    <ul>${it.kpi.map(k=>`<li>${esc(k)}</li>`).join("")}</ul>
    <div class="ai">${it.ai.map(a=>`<span>${esc(a)}</span>`).join("")}</div></button>`;
}
function filterNote(){
  if(!filtering()) return "";
  const parts=[];if(state.q)parts.push(`검색 "${esc(state.q)}"`);if(state.ai.size)parts.push("AI: "+[...state.ai].join(", "));
  return `<div class="active-filter">필터 적용 중 · ${parts.join(" / ")} <button onclick="clearFilter()">초기화</button></div>`;
}
function gridOf(list){
  state.list=list.map(i=>i.id);
  return list.length?`<div class="grid">${list.map(card).join("")}</div>`:`<div class="empty">조건에 맞는 출품작이 없습니다.</div>`;
}
function sortAw(a,b){return AWARD_ORDER[a.award]-AWARD_ORDER[b.award]}

function renderHome(){
  const aw=ITEMS.filter(i=>i.award).sort(sortAw);
  const max=Math.max(...CATS.map(c=>ITEMS.filter(i=>i.cat===c.id).length));
  const aiCnt=AIS.map(a=>[a,ITEMS.filter(i=>i.ai.includes(a)).length]).sort((x,y)=>y[1]-x[1]);
  const aiMax=aiCnt[0][1];
  state.list=aw.map(i=>i.id);
  return `<div class="hero"><div class="eb">AX STAR 2026 · 출품작 소개</div>
    <h2>현장에서 직접 AI로 업무를 바꾼 ${ITEMS.length}개의 도전</h2>
    <p>분야별로 묶어 정리했습니다. 좌측 메뉴에서 분야를 고르고, 카드를 누르면 출품서 원문 전체(목표·문제점·기술·적용 내용·성과)를 볼 수 있습니다.</p></div>
    <div class="kpis">
      <div class="kpi"><b>${ITEMS.length}건</b><span>전체 출품</span></div>
      <div class="kpi g"><b>${aw.length}건</b><span>수상 (최우수 1 · 우수 3)</span></div>
      <div class="kpi"><b>${CATS.length}개</b><span>분야</span></div>
      <div class="kpi"><b>${new Set(ITEMS.map(i=>i.team)).size}개</b><span>참여 조직</span></div>
    </div>
    <div class="sec"><div class="sec-h"><h3>🏆 수상작</h3><a onclick="go('award')">수상작 모아보기 ›</a></div>${aw.length?`<div class="grid">${aw.map(card).join("")}</div>`:""}</div>
    <div class="sec"><div class="sec-h"><h3>분야별 출품 현황</h3><a onclick="go('all')">전체 보기 ›</a></div>
      <div class="catgrid">${CATS.map(c=>{const n=ITEMS.filter(i=>i.cat===c.id).length;
        return `<button class="catcard" onclick="go('cat-${c.id}')"><div class="top"><span class="ic">${c.icon}</span><span class="n">${n}</span></div>
        <h4>${esc(c.name)}</h4><p>${esc(c.desc)}</p><div class="bar"><i style="width:${n/max*100}%"></i></div></button>`}).join("")}</div></div>
    <div class="sec"><div class="sec-h"><h3>활용 AI 현황</h3></div>
      <div class="aibar">${aiCnt.map(([a,n])=>`<div class="airow"><span>${a}</span><div class="t"><i style="width:${n/aiMax*100}%"></i></div><b>${n}건</b></div>`).join("")}
      <div class="note">과제별 주요 활용 AI 기준 (1개 과제에서 여러 AI를 쓴 경우 중복 집계) · 좌측 필터로 해당 과제만 볼 수 있습니다.</div></div></div>`;
}

function render(){
  renderNav();
  const v=state.view;let h="";
  if(v==="home"&&!filtering()){h=renderHome();}
  else if(v==="award"){
    const l=ITEMS.filter(i=>i.award&&matches(i)).sort(sortAw);
    h=`<div class="ph"><div class="crumb">개요</div><h2>🏆 수상작</h2><p>사람 평가(AX Pro)와 AI 평가를 종합해 선정된 최우수 1건, 우수 3건</p>${filterNote()}</div>`+gridOf(l);
  }else if(v.startsWith("cat-")){
    const c=catOf(v.slice(4));const l=ITEMS.filter(i=>i.cat===c.id&&matches(i)).sort((a,b)=>(a.award?AWARD_ORDER[a.award]:9)-(b.award?AWARD_ORDER[b.award]:9));
    h=`<div class="ph"><div class="crumb">분야별</div><h2>${c.icon} ${esc(c.name)}</h2><p>${esc(c.desc)} · ${l.length}건</p>${filterNote()}</div>`+gridOf(l);
  }else{ // all (또는 홈에서 검색/필터)
    const l=ITEMS.filter(matches);
    h=`<div class="ph"><div class="crumb">개요</div><h2>📋 전체 출품작</h2><p>분야별로 묶어 보여드립니다 · ${l.length}건</p>${filterNote()}</div>`;
    if(!l.length){h+=`<div class="empty">조건에 맞는 출품작이 없습니다.</div>`;state.list=[];}
    else{state.list=[];CATS.forEach(c=>{const g=l.filter(i=>i.cat===c.id).sort((a,b)=>(a.award?AWARD_ORDER[a.award]:9)-(b.award?AWARD_ORDER[b.award]:9));
      if(!g.length)return;state.list.push(...g.map(i=>i.id));
      h+=`<div class="cat-block"><div class="cat-title">${c.icon} ${esc(c.name)} <small>${g.length}건</small></div><div class="grid">${g.map(card).join("")}</div></div>`;});}
  }
  document.getElementById("view").innerHTML=h;
}

function go(v){state.view=v;try{history.replaceState(null,"","#"+v);}catch(e){}closeSide();render();window.scrollTo({top:0});}
function toggleAI(a){state.ai.has(a)?state.ai.delete(a):state.ai.add(a);if(state.view==="home")state.view="all";render();}
function clearFilter(){state.q="";state.ai.clear();document.getElementById("q").value="";render();}
document.getElementById("q").addEventListener("input",e=>{state.q=e.target.value.trim();if(state.q&&state.view==="home")state.view="all";render();});

function fmt(s){
  let t=esc(s||"");
  t=t.replace(/`([^`\n]+)`/g,"<code>$1</code>");
  t=t.replace(/\*\*([^*\n]+?)\*\*/g,"<b>$1</b>");
  return t;
}
function openItem(id){
  const it=ITEMS[id];state.cur=id;const c=catOf(it.cat);
  const aw=it.award?`<span class="pill ${it.award==="best"?"best":"ex"}">${it.award==="best"?"★ 최우수상":"우수상"}</span> `:"";
  document.getElementById("dh").className="dh"+(it.award?" aw":"");
  document.getElementById("dh").innerHTML=`<button class="x" onclick="closeAll()" aria-label="닫기">✕</button>
    <div>${aw}<span class="pill">${c.icon} ${esc(c.name)}</span></div><h3>${esc(it.fullTitle)}</h3>
    <div class="who">${esc(it.who)} · ${esc(it.dept)}</div>
    <div class="dmeta"><span>활용 AI: ${esc(it.ai.join(", "))}</span><span>제출일 ${esc(it.date)}</span></div>`;
  const sec=(ic,t,body,cls="")=>body?`<details open><summary>${ic} ${t}</summary><div class="dc ${cls}">${body}</div></details>`:"";
  document.getElementById("db").innerHTML=`<div class="hl">${it.kpi.map(k=>`<div>✔ ${esc(k)}</div>`).join("")}</div>
    <div class="dtools"><button onclick="toggleAllSec()">모두 접기 / 펼치기</button></div>`
    +sec("🎯","목표",fmt(it.goal))+sec("⚠️","문제점",fmt(it.prob))
    +sec("🧰","툴 / 기술",`<div class="tchips">${it.chips.map(t=>`<span>${esc(t)}</span>`).join("")}</div><div class="raw">${fmt(it.tools)}</div>`)
    +sec("💡","핵심 적용 내용",fmt(it.how))+sec("📈","정량적 성과",fmt(it.quant),"q")+sec("🌱","정성적 성과",fmt(it.qual),"l");
  document.getElementById("db").scrollTop=0;
  const pos=state.list.indexOf(id);const p=document.getElementById("prev"),n=document.getElementById("next");
  p.disabled=pos<=0;n.disabled=pos<0||pos>=state.list.length-1;
  p.onclick=()=>openItem(state.list[pos-1]);n.onclick=()=>openItem(state.list[pos+1]);
  document.getElementById("drawer").classList.add("on");document.getElementById("drawer").setAttribute("aria-hidden","false");
  document.getElementById("dim").classList.add("on");
}
function toggleAllSec(){const d=[...document.querySelectorAll("#db details")];const open=d.some(x=>!x.open);d.forEach(x=>x.open=open);}
function closeAll(){document.getElementById("drawer").classList.remove("on");document.getElementById("drawer").setAttribute("aria-hidden","true");closeSide();document.getElementById("dim").classList.remove("on");}
function toggleSide(){document.getElementById("side").classList.toggle("on");document.getElementById("dim").classList.toggle("on");}
function closeSide(){document.getElementById("side").classList.remove("on");if(!document.getElementById("drawer").classList.contains("on"))document.getElementById("dim").classList.remove("on");}
document.addEventListener("keydown",e=>{
  if(!document.getElementById("drawer").classList.contains("on"))return;
  if(e.key==="Escape")closeAll();
  if(e.key==="ArrowRight"&&!document.getElementById("next").disabled)document.getElementById("next").click();
  if(e.key==="ArrowLeft"&&!document.getElementById("prev").disabled)document.getElementById("prev").click();
});
let h0="";try{h0=location.hash.slice(1);}catch(e){}if(["home","award","all",...CATS.map(c=>"cat-"+c.id)].includes(h0))state.view=h0;
render();
</script>
</body>
</html>
